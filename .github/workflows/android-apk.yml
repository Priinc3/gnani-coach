name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "https:// URL of the hosted Speaking Coach web app (defaults to the APP_URL repository variable)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_URL: ${{ inputs.app_url || vars.APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate APP_URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL is empty. Pass the app_url input or set the APP_URL repository variable."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *)
              echo "::error::APP_URL must start with https:// (cleartext HTTP is not allowed)."
              exit 1
              ;;
          esac

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Inject APP_URL into the offline page
        working-directory: apps/mobile
        run: |
          node -e "const fs=require('fs');const p='www/error.html';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace('__APP_URL__',()=>process.env.APP_URL));"

      - name: Sync Capacitor Android project
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Write APK SHA-256 to the job summary
        working-directory: apps/mobile
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "### Android debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: speaking-coach-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
