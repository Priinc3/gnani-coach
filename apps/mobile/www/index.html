<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speaking Coach — offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #101820;
        color: #f4f7f9;
      }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
      p { line-height: 1.5; margin: 0 0 1.25rem; color: #c7d2da; }
      button {
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.6rem;
        background: #3ddc97;
        color: #082018;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Speaking Coach is offline</h1>
      <p>This app needs an internet connection to open the hosted practice site. Check your connection, then try again.</p>
      <button id="retry" type="button">Retry</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
